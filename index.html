<title>巴登巴登春遊</title>
<style>
:root{
  --page:#f3eee6;--card:#fffdf9;--ink:#2a2420;--muted:#5a4d45;--line:#c9a894;--head:#5e2d25;
  --accent:#7a3b30;--accent-fg:#ffffff;--soft:#f8f1e8;
  --warn-bg:#f7ead9;--warn-fg:#4a2e12;--tbc-bg:#eceff6;--tbc-fg:#26325a;--ok-bg:#eef2e8;--ok-fg:#2f4a2a;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU",serif;
}
*{box-sizing:border-box}
html{font-size:20px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);line-height:1.65;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  padding:0 max(16px,env(safe-area-inset-right)) 3rem max(16px,env(safe-area-inset-left))}
.wrap{max-width:760px;margin:0 auto}
svg{display:block}
header.top{padding:.8rem 0 .5rem}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.brand{display:flex;align-items:center;gap:.7rem}
h1{font-family:var(--serif);font-size:1.4rem;margin:0;line-height:1.25;color:var(--head)}
h1 small{display:block;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:.8rem;font-weight:500;color:var(--muted)}
.fs{display:flex;flex:0 0 auto;white-space:nowrap}
.fs button{min-width:48px;min-height:48px;font-size:1rem;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--accent);margin-left:.25rem;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--line)}
.tabs{position:sticky;top:0;z-index:20;background:var(--page);border-bottom:1px solid var(--line);padding:.45rem 0;display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.tabs button{min-height:56px;font-family:var(--serif);font-size:1.1rem;font-weight:800;border:1px solid var(--line);background:var(--card);color:var(--accent);
  box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--line)}
.tabs button[aria-selected=true]{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--accent),inset 0 0 0 4px rgba(255,255,255,.6)}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding:.5rem 0 .3rem;scrollbar-width:thin}
.chips a{flex:0 0 auto;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 .75rem;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700;font-size:.85rem;line-height:1.2;background:var(--card)}
.chips a.today{border:2px solid var(--accent);color:var(--accent)}
.chips a span{font-weight:500;font-size:.7rem;color:var(--muted)}
#toTop{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));z-index:30;min-width:56px;min-height:56px;padding:0 .9rem;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:800;font-size:.95rem;box-shadow:0 2px 8px rgba(0,0,0,.25),inset 0 0 0 3px var(--accent),inset 0 0 0 4px rgba(255,255,255,.55)}
h2{font-family:var(--serif);color:var(--head);font-size:1.25rem;margin:1.6rem 0 .6rem;display:flex;align-items:center;gap:.7rem}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
h3{font-size:1.1rem;margin:0}
.card{background:var(--card);border:1px solid var(--dl,var(--line));box-shadow:inset 0 0 0 5px var(--card),inset 0 0 0 6px var(--dl,var(--line));padding:1.2rem 1.1rem 1.1rem;margin:1.1rem 0;scroll-margin-top:5rem}
.card.today{border:2px solid var(--accent);box-shadow:inset 0 0 0 5px var(--card),inset 0 0 0 6px var(--accent)}
.dayhead{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
.dayhead .ttlbox{flex:1;min-width:10rem}
.date{font-family:var(--serif);font-size:1.7rem;font-weight:800;line-height:1.15;color:var(--dh,var(--head))}
.dtitle{font-family:var(--serif);font-size:1.12rem;font-weight:700;line-height:1.35}
.who{color:var(--muted);font-size:.85rem;margin:.15rem 0 .5rem}
.tag{display:inline-block;font-size:.72rem;font-weight:800;padding:0 .4rem;margin-right:.4rem;vertical-align:.1em;border:1px solid currentColor}
.tag.w{background:var(--warn-bg);color:var(--warn-fg)} .tag.q{background:var(--tbc-bg);color:var(--tbc-fg)}
.tag.o{background:var(--ok-bg);color:var(--ok-fg)} .tag.t{background:var(--accent);color:#fff;border-color:var(--accent)}
ul.notes,ul.plain{margin:.4rem 0;padding-left:0;list-style:none}
ul.notes li,ul.plain li{padding:.45rem .65rem;margin:.35rem 0;border:1px solid var(--line);background:var(--card)}
ul.notes li.warn{background:var(--warn-bg);color:var(--warn-fg);border-color:transparent;border-left:4px solid var(--warn-fg)}
ul.notes li.tbc{background:var(--tbc-bg);color:var(--tbc-fg);border-color:transparent}
.drive{margin:.5rem 0;padding:.5rem .75rem;border-left:4px solid var(--dl,var(--line));background:var(--soft)}
.drive div{margin:.1rem 0}
.flower{margin:.5rem 0;padding:.5rem .75rem;border:1px dashed var(--dl,var(--line));background:var(--soft)}
.stop{margin-top:1.3rem}
.band{height:16px;background-image:var(--band);background-repeat:repeat-x;background-position:center;background-size:auto 100%;margin-bottom:.6rem}
.stop.opt .band{opacity:.65}
.shead{display:flex;gap:.7rem;align-items:center}
.shead .emb{flex:0 0 auto}
h4{font-family:var(--serif);font-size:1.15rem;margin:0;line-height:1.35;color:var(--sh,var(--head))}
.stop .de{margin:0;color:var(--muted);font-size:.82rem;line-height:1.35}
.stop p{margin:.35rem 0}
.meta{font-size:.9rem;margin:.2rem 0}.meta b{display:inline-block;min-width:4.6em;color:var(--muted)}
figure.ph{margin:.55rem 0;padding:6px;background:#fff;border:1px solid var(--sl,var(--line))}
figure.ph img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--soft)}
.row{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.6rem;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:.4rem 1.05rem;font-weight:800;text-decoration:none;background:var(--accent);color:var(--accent-fg);border:1px solid var(--accent);font-size:1rem;cursor:pointer;
  box-shadow:inset 0 0 0 3px var(--accent),inset 0 0 0 4px rgba(255,255,255,.5)}
.btn.alt{background:var(--card);color:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--accent)}
.btn[aria-disabled=true]{opacity:.55;pointer-events:none}
.lnk{color:var(--accent);font-weight:700;min-height:48px;display:inline-flex;align-items:center}
.wx{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0}
.wx span{padding:.2rem .6rem;border:1px solid var(--line);font-size:.88rem;background:var(--soft)}
.wxpanel{display:grid;gap:.6rem}
@media (min-width:560px){.wxpanel{grid-template-columns:1fr 1fr}}
.wxbox{border:1px solid var(--line);padding:.6rem .8rem;background:var(--soft)}
.wxbox b{display:block;font-family:var(--serif)}
.big{font-size:1.6rem;font-weight:800}
.note-small{font-size:.8rem;color:var(--muted)}
details{border:1px solid var(--line);box-shadow:inset 0 0 0 4px var(--card),inset 0 0 0 5px var(--line);padding:.6rem .95rem;margin:.9rem 0;background:var(--card)}
summary{min-height:48px;display:flex;align-items:center;font-family:var(--serif);font-weight:800;cursor:pointer;color:var(--head)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border:1px solid var(--line);padding:.35rem .5rem;text-align:left;vertical-align:top}
.st{display:inline-block;min-width:5.2em;font-weight:800;font-size:.8rem;padding:.05rem .45rem;text-align:center}
.st.done{background:var(--ok-bg);color:var(--ok-fg)}.st.later{background:var(--tbc-bg);color:var(--tbc-fg)}
.st.ask{background:var(--warn-bg);color:var(--warn-fg)}.st.draft{background:var(--card);border:1px solid var(--line)}.st.todo{background:var(--tbc-bg);color:var(--tbc-fg)}
label.chk{display:flex;gap:.7rem;align-items:flex-start;padding:.5rem 0;min-height:48px}
label.chk input{width:28px;height:28px;flex:0 0 auto;margin-top:.15rem;accent-color:var(--accent)}
input,select,textarea{font:inherit;min-height:52px;padding:.3rem .6rem;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
.loggrid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}.loggrid .full{grid-column:1/-1}
footer{margin-top:2rem;font-size:.8rem;color:var(--muted)}
footer a{color:var(--accent)}
.hidden{display:none!important}
:focus-visible{outline:4px solid var(--accent);outline-offset:2px}
@media print{.fs,.tabs,#toTop{display:none}}

/* ---- 每日移動預覽 ---- */
.ico{fill:none;stroke:var(--dh,var(--head));stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.move{margin:.9rem 0;padding:.8rem .7rem;border:1px solid var(--dl,var(--line));background:var(--soft)}
.move h3{font-family:var(--serif);color:var(--dh,var(--head));font-size:1.1rem;margin:0 0 .4rem}
.mv-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:.15rem .6rem;margin:.45rem 0}
.mv-row>b{min-width:2.6em;font-family:var(--serif)}
.mv-bar{flex:1 1 100%;height:9px;background:var(--card);border:1px solid var(--line)}
.mv-bar i{display:block;height:100%;background:var(--accent)}
.lv{font-size:.78rem;font-weight:800;padding:0 .45rem;border:1px solid currentColor;white-space:nowrap}
.lv.ok{background:var(--ok-bg);color:var(--ok-fg)}.lv.mid{background:var(--warn-bg);color:var(--warn-fg)}.lv.hi{background:#f6dcd6;color:#6a1f14}
svg.mp{width:100%;height:auto;margin:.6rem 0;border:1px solid var(--line);background:var(--card)}
.mp .case{fill:none;stroke:#fff;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.mp .road{fill:none;stroke:var(--accent);stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
.mp .alt{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:5 4}
.mp .lead{stroke:var(--muted);stroke-width:1}.mp .lead-dot{fill:var(--muted)}
.mp .badge{fill:#fff;stroke:var(--dh,var(--head));stroke-width:1.6}
.mp .badge.solid{fill:var(--accent);stroke:var(--accent)}
.mp .badge.dash{stroke-dasharray:3 2.5}
.mp .ico.inv{stroke:#fff}
.mp .num{fill:var(--accent);stroke:#fff;stroke-width:1.2}
.mp text.n{fill:#fff;font:700 14px sans-serif;text-anchor:middle}
.mp text.sc{fill:var(--muted);font:16px sans-serif}
.mp .sb{stroke:var(--muted);stroke-width:1.5}
ol.mv-legend{list-style:none;margin:.5rem 0 .3rem;padding:0}
.mv-legend li{display:flex;gap:.6rem;align-items:flex-start;padding:.45rem 0;border-top:1px solid var(--line)}
.mv-legend svg{flex:0 0 auto;margin-top:.1rem}
.mv-n{flex:0 0 1.55rem;width:1.55rem;height:1.55rem;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:.82rem;display:flex;align-items:center;justify-content:center;margin-top:.15rem}
.mv-n.opt{background:var(--card);color:var(--accent);border:1.5px dashed var(--accent)}
.mv-n.start{background:var(--head)}
.small{font-size:.85rem;color:var(--muted);line-height:1.5}
.dim{color:var(--muted);font-size:.8rem}
.ov{padding:.6rem .6rem}
table.ovt{font-size:.88rem}
table.ovt th{background:var(--soft);font-family:var(--serif)}
table.ovt td{vertical-align:middle}
table.ovt td:first-child{white-space:nowrap;font-weight:800;text-align:center;width:3.6rem}
table.ovt a{color:var(--accent);text-decoration:none}
table.ovt .mv-bar{margin-top:.2rem;height:7px}

/* ---- 收納（摺疊） ---- */
details>summary{list-style:none;display:flex;flex-wrap:nowrap;align-items:center;gap:.1rem .6rem}
.sx{flex:1 1 0;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:.05rem .6rem}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"展開 ▾";margin-left:auto;padding-left:.6rem;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:.8rem;font-weight:700;color:var(--accent);white-space:nowrap}
details[open]>summary::after{content:"收合 ▴"}
.sh{font-family:var(--serif);font-weight:800;color:var(--head);font-size:1.05rem}
.ss{flex:1 1 9rem;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;font-weight:500;font-size:.82rem;color:var(--muted);line-height:1.55}
.ss .tag{margin:0 .3rem 0 0}
.sl{display:block}
details.sec{padding:0 .95rem;margin:.7rem 0}
details.sec>summary{min-height:58px;padding:.35rem 0}
details.sec[open]>summary{border-bottom:1px solid var(--line)}
.sec-body{padding:.7rem 0 .9rem}
.sec-body .ov{padding:0}
details.fold{border:1px solid var(--dl,var(--line));box-shadow:none;background:var(--card);padding:0 .75rem;margin:.6rem 0}
details.fold>summary{min-height:54px;padding:.3rem 0}
details.fold[open]>summary{border-bottom:1px solid var(--line)}
.fold-body{padding:.5rem 0 .7rem}
details.move{background:var(--soft)}
details.optstop{border:1px dashed var(--sl,var(--line));margin:.3rem 0 0}
details.optstop>summary .shead{flex:1 1 0;min-width:0}
details.more{border:1px dashed var(--sl,var(--line));margin:.5rem 0}
</style>
</head>

function dayCalc(day){
  const R=ROUTES[day.date]||null, stops=day.e.stops||[];

function mapHTML(day){
  const R=ROUTES[day.date]; if(!R) return '';
  const rtIds=Object.keys(R.rt||{});
  if(!(R.pts&&R.pts.length)&&!rtIds.length) return '';
  const W=360,H=300,P=38, e=day.e, stops=e.stops||[], opts=e.opt||[];
  const ll=id=>{const r=id==='home'?HOME_PT:RES[id];return r&&r.lat!=null?[r.lon,r.lat]:null;};
  const marks=[];
  marks.push({id:'home',kind:'home',ll:ll('home')});
  if(R.seq&&R.seq[0]==='fra') marks.push({id:'fra',kind:'fra',ll:ll('fra')});
  if(R.seq&&R.seq[R.seq.length-1]==='fra'&&R.seq[0]!=='fra') marks.push({id:'fra',kind:'fra',ll:ll('fra')});
  stops.forEach((id,i)=>{const p=ll(id);if(p)marks.push({id,kind:'stop',n:i+1,ll:p});});
  [...opts,...rtIds.filter(x=>!opts.includes(x))].forEach(id=>{const p=ll(id);if(p&&!marks.some(m=>m.id===id))marks.push({id,kind:'opt',ll:p});});
  const all=[...(R.pts||[]),...rtIds.flatMap(k=>R.rt[k].pts),...marks.map(m=>m.ll)];
  const xs=all.map(p=>p[0]),ys=all.map(p=>p[1]);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const k=Math.cos(((minY+maxY)/2)*Math.PI/180);
  const dx=Math.max((maxX-minX)*k,0.02), dy=Math.max(maxY-minY,0.015);
  const s=Math.min((W-2*P)/dx,(H-2*P)/dy), ox=(W-dx*s)/2, oy=(H-dy*s)/2;
  const X=lon=>ox+(lon-minX)*k*s, Y=lat=>oy+(maxY-lat)*s;
  const path=pts=>pts.map((p,i)=>`${i?'L':'M'}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('');
  // 圖示彼此太近時推開，並畫一條細線指回真實位置
  marks.forEach(m=>{m.x=X(m.ll[0]);m.y=Y(m.ll[1]);m.tx=m.x;m.ty=m.y;});
  for(let it=0;it<80;it++){let moved=false;
    for(let i=0;i<marks.length;i++)for(let j=i+1;j<marks.length;j++){
      let a=marks[i],b=marks[j],vx=b.x-a.x,vy=b.y-a.y,d=Math.hypot(vx,vy);
      if(d<42){if(d<0.01){vx=Math.cos(i+j);vy=Math.sin(i+j);d=1;}const push=(42-d)/2+0.3;a.x-=vx/d*push;a.y-=vy/d*push;b.x+=vx/d*push;b.y+=vy/d*push;moved=true;}}
    marks.forEach(m=>{m.x=Math.min(W-22,Math.max(22,m.x));m.y=Math.min(H-26,Math.max(26,m.y));});
    if(!moved)break;}
  const nearest=(m)=>{let best=null,bd=1e9;(R.pts||[]).forEach(p=>{const d=Math.hypot(X(p[0])-m.tx,Y(p[1])-m.ty);if(d<bd){bd=d;best=[X(p[0]),Y(p[1])];}});return best;};
  const mpp=111320/s; let L=0.5;[0.5,1,2,5,10,20,50,100].forEach(v=>{if(v*1000/mpp<=W*0.34)L=v;});
  const scaleW=L*1000/mpp, scaleTxt=L<1?`${L*1000} 公尺`:`${L} 公里`;
  const sbHit=(x,y)=>marks.some(m=>m.x>x-26&&m.x<x+scaleW+26&&m.y>y-36&&m.y<y+24);
  const sbCands=[[P-12,H-16],[W-P+12-scaleW,H-16],[P-12,46],[W-P+12-scaleW,46]];
  const sbPos=sbCands.find(c=>!sbHit(c[0],c[1]))||sbCands[1];
  let g=`<svg class="mp" viewBox="0 0 ${W} ${H}" role="img" aria-label="今日行車路線示意圖">`;
  if(R.pts&&R.pts.length) g+=`<path class="case" d="${path(R.pts)}"/><path class="road" d="${path(R.pts)}"/>`;
  rtIds.forEach(id=>{g+=`<path class="alt" d="${path(R.rt[id].pts)}"/>`;});
  marks.forEach(m=>{
    if(m.kind==='opt'&&!rtIds.includes(m.id)){const nb=nearest(m);if(nb)g+=`<line class="alt" x1="${nb[0].toFixed(1)}" y1="${nb[1].toFixed(1)}" x2="${m.x.toFixed(1)}" y2="${m.y.toFixed(1)}"/>`;}
    if(Math.hypot(m.x-m.tx,m.y-m.ty)>8) g+=`<line class="lead" x1="${m.tx.toFixed(1)}" y1="${m.ty.toFixed(1)}" x2="${m.x.toFixed(1)}" y2="${m.y.toFixed(1)}"/><circle class="lead-dot" cx="${m.tx.toFixed(1)}" cy="${m.ty.toFixed(1)}" r="2.2"/>`;});
  marks.forEach(m=>{
    const ic=m.kind==='home'?'home':m.kind==='fra'?'plane':spotIcon(m.id);
    const cls=m.kind==='home'||m.kind==='fra'?'badge solid':m.kind==='opt'?'badge dash':'badge';
    g+=`<g transform="translate(${m.x.toFixed(1)},${m.y.toFixed(1)})"><circle class="${cls}" r="18"/><g transform="translate(-13.2,-13.2) scale(1.1)"><path class="${m.kind==='home'||m.kind==='fra'?'ico inv':'ico'}" d="${ICON[ic]}"/></g>${m.kind==='stop'?`<circle class="num" cx="14" cy="-14" r="10"/><text class="n" x="14" y="-9.4">${m.n}</text>`:''}</g>`;});
  g+=`<g transform="translate(${sbPos[0].toFixed(1)},${sbPos[1]})"><line class="sb" x1="0" y1="0" x2="${scaleW.toFixed(1)}" y2="0"/><line class="sb" x1="0" y1="-5" x2="0" y2="5"/><line class="sb" x1="${scaleW.toFixed(1)}" y1="-5" x2="${scaleW.toFixed(1)}" y2="5"/><text class="sc" x="${(scaleW/2).toFixed(1)}" y="-8" text-anchor="middle">${scaleTxt}</text></g>`;
  g+=`<text class="sc" x="${W-12}" y="22" text-anchor="end">北 ↑</text></svg>`;
  return g;
}
function legendRow(n,id,optional,R){
  const s=SPOTS[id], w=s.wk;
  const walkTxt=w?`步行約 ${fmtKm(w[0])}–${fmtKm(w[1])} 公里（約 ${walkMin(w[0])}–${walkMin(w[1])} 分鐘）<span class="tag q">預估</span>`:'';
  let extra='';

    if(o) extra=`<br>順路另加車程約 ${o.dkm>=0?'+':''}${Math.round(o.dkm)} 公里・${o.dmin>=0?'+':''}${fmtMin(Math.max(o.dmin,0)).replace(' 分鐘',' 分')}`;
    else if(r) extra=`<br>從民宿短程往返約 ${Math.round(r.km)} 公里・${fmtMin(r.min)}`;}
  return `<li><span class="mv-n${optional?' opt':''}">${optional?'選':n}</span>${iconSvg(spotIcon(id),28)}<div><b>${esc(s.zh)}</b>${optional?' <span class="tag o">選配</span>':''}<br><span class="small">${walkTxt||'以參觀為主，步行很少'}${s.wn?`<br>${esc(s.wn)}`:''}${extra}</span></div></li>`;
}

/* ================= 天氣（Open-Meteo） ================= */
const WX = {fc:{},cl:{},now:{}};
const WMO = c=>c===0?'☀️ 晴':c<=2?'🌤 晴時多雲':c===3?'☁️ 陰':c<=48?'🌫 霧':c<=57?'🌦 毛毛雨':c<=67?'🌧 雨':c<=77?'❄️ 雪':c<=82?'🌦 陣雨':c<=86?'🌨 陣雪':'⛈ 雷雨';
function cget(k,h){const o=store(k);return o&&Date.now()-o.t<h*3600e3?o.v:null;}
const cset=(k,v)=>store(k,{t:Date.now(),v});
async function jget(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json();}
const q=(l)=>`latitude=${l.lat}&longitude=${l.lon}${l.elev?`&elevation=${l.elev}`:''}&timezone=Europe%2FBerlin`;
async function loadForecast(k){
  const key=`baden27.fc.${k}`;let j=cget(key,1);
  if(!j){j=await jget(`https://api.open-meteo.com/v1/forecast?${q(LOC[k])}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&past_days=2&forecast_days=16`);cset(key,j);}
  WX.now[k]={t:j.current.temperature_2m,c:j.current.weather_code};
  WX.fc[k]={};j.daily.time.forEach((d,i)=>WX.fc[k][d]={c:j.daily.weather_code[i],tx:j.daily.temperature_2m_max[i],tn:j.daily.temperature_2m_min[i],pp:j.daily.precipitation_probability_max[i]});
}
async function loadClimate(k){
  const key=`baden27.cl.${k}`;let agg=cget(key,24*30);
  if(!agg){
    const parts=await Promise.all(CLIM_YEARS.map(y=>jget(`https://archive-api.open-meteo.com/v1/archive?${q(LOC[k])}&start_date=${y}-04-09&end_date=${y}-04-26&daily=temperature_2m_max,temperature_2m_min,precipitation_sum`)));
    const m={};
    parts.forEach(j=>j.daily.time.forEach((d,i)=>{const md=d.slice(5);(m[md]=m[md]||{tx:[],tn:[],p:[]});
      if(j.daily.temperature_2m_max[i]!=null){m[md].tx.push(j.daily.temperature_2m_max[i]);m[md].tn.push(j.daily.temperature_2m_min[i]);m[md].p.push(j.daily.precipitation_sum[i]||0);}}));
    const av=a=>a.reduce((s,x)=>s+x,0)/a.length;agg={};
    Object.keys(m).forEach(md=>{if(m[md].tx.length)agg[md]={tx:av(m[md].tx),tn:av(m[md].tn),p:av(m[md].p)};});
    cset(key,agg);
  }
  WX.cl[k]=agg;
}
function wxText(date,k){
  const f=WX.fc[k]&&WX.fc[k][date];
  if(f)return `${LOC[k].label.split('（')[0]}｜預報 ${Math.round(f.tn)}–${Math.round(f.tx)}°C ${WMO(f.c)} 降雨機率 ${f.pp??'-'}%`;
  const c=WX.cl[k]&&WX.cl[k][date.slice(5)];
  if(c)return `${LOC[k].label.split('（')[0]}｜往年同期約 ${Math.round(c.tn)}–${Math.round(c.tx)}°C，日降雨約 ${c.p.toFixed(1)} mm`;
  return null;
}
function paintWx(){
  document.querySelectorAll('[data-wx]').forEach(el=>{const [d,k]=el.dataset.wx.split('|');const t=wxText(d,k);el.textContent=t||'天氣暫時無法取得';});
  const sm=$('#wxSum');if(sm){const n=WX.now.low,h=WX.now.high;sm.textContent=n?`巴登巴登現在 ${Math.round(n.t)}°C ${WMO(n.c)}${h?`　高地 ${Math.round(h.t)}°C`:''}`:'載入中…';}
  const box=$('#wxPanel');if(!box)return;
  const days=DAYS.map(d=>d.date).filter(d=>d>='2027-04-10'&&d<='2027-04-25');
  const mean=(k,f)=>{const v=days.map(d=>WX.cl[k]&&WX.cl[k][d.slice(5)]).filter(Boolean).map(x=>x[f]);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null;};
  const inFc=['low','high'].some(k=>WX.fc[k]&&days.some(d=>WX.fc[k][d]));
  box.innerHTML=['low','high'].map(k=>{const n=WX.now[k],tx=mean(k,'tx'),tn=mean(k,'tn'),p=mean(k,'p');
    return `<div class="wxbox"><b>${esc(LOC[k].label)}</b>
      <div>現在：${n?`<span class="big">${Math.round(n.t)}°C</span> ${WMO(n.c)}`:'載入中…'}</div>
      <div>4/10–4/25 往年平均：${tx!=null?`白天約 ${Math.round(tx)}°C、早晚約 ${Math.round(tn)}°C，日降雨約 ${p.toFixed(1)} mm`:'載入中…'}</div></div>`;}).join('')
    +`<p class="note-small" style="grid-column:1/-1">${inFc?'行程日期已進入預報範圍：各日卡片顯示預報。':'預報最多只到約 16 天後；目前各日卡片顯示往年同期平均（取 '+CLIM_YEARS[0]+'–'+CLIM_YEARS[CLIM_YEARS.length-1]+' 年），進入 16 天內自動換成預報。'}</p>`;
}
async function loadWeather(){
  const ks=['low','high','somm'];
  await Promise.all(ks.map(k=>loadClimate(k).catch(()=>{})));
  await Promise.all(ks.map(k=>loadForecast(k).catch(()=>{})));
  paintWx();
}

function show(tab){

function bindWork(){
  document.querySelectorAll('[data-chk]').forEach(i=>i.addEventListener('change',()=>{const s=store('baden27.chk')||{};s[i.dataset.chk]=i.checked;store('baden27.chk',s);}));

  $('#lgCopy').addEventListener('click',()=>{const a=store('baden27.log')||[];copy(a.map(x=>`${x.ts}\t${x.type}\t${x.amt||''}\t${x.note||''}`).join('\n')||'（無紀錄）',$('#lgCopy'));});
  $('#lgClear').addEventListener('click',()=>{if(confirm('確定清空所有紀錄？')){store('baden27.log',[]);renderLog();}});
}
async function copy(t,btn){const o=btn.textContent;try{await navigator.clipboard.writeText(t);btn.textContent='已複製';}catch(e){btn.textContent='複製失敗，請長按文字手動複製';}setTimeout(()=>btn.textContent=o,1800);}
